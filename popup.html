<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rex Snap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px; padding: 18px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(120% 120% at 0% 0%, #12182b 0%, #05070d 70%);
    color: #eaf0ff;
  }
  h1 { font-size: 18px; letter-spacing: .3px; display:flex; align-items:center; gap:8px; }
  h1 span { color:#4aa3ff; }
  .sub { font-size: 12px; color:#8da0c4; margin: 4px 0 14px; }
  .status {
    display:flex; align-items:center; gap:8px; font-size:12px; color:#9fb3d9;
    padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08); margin-bottom:12px;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:#667; }
  .dot.on { background:#27d17f; box-shadow:0 0 8px #27d17f; }
  .row { display:flex; gap:8px; margin-bottom:10px; }
  button.big {
    flex:1; padding:12px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.14);
    font-weight:700; font-size:14px; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#0a84ff,#6e3bff); transition:transform .1s;
  }
  button.big.alt { background:rgba(255,255,255,.07); }
  button.big:active { transform:scale(.97); }
  label { display:block; font-size:12px; color:#9fb3d9; margin: 12px 0 6px; }
  select, input[type=range] { width:100%; }
  select {
    padding:9px; border-radius:10px; background:#0d1424; color:#eaf0ff;
    border:1px solid rgba(255,255,255,.14); font-size:13px;
  }
  .switch { display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-top:12px; }
  .hint { font-size:11px; color:#6f84ad; margin-top:14px; line-height:1.5; }
  kbd { background:#1a2340; border:1px solid #2c3a63; padding:1px 6px; border-radius:5px; font-size:11px; }
</style>
</head>
<body>
  <h1>🫰 Rex <span>Snap</span></h1>
  <div class="sub">Disappear from video meetings. 100% on your device.</div>

  <div class="status"><div class="dot" id="dot"></div><div id="statusText">Open a meeting tab to activate</div></div>

  <div class="row">
    <button class="big" id="snapBtn">🫰 Snap</button>
    <button class="big alt" id="returnBtn">↩ Return</button>
  </div>

  <label for="style">Particle style</label>
  <select id="style">
    <option value="dust">Dust (like the video)</option>
    <option value="sand">Golden sand</option>
    <option value="embers">Fire embers</option>
    <option value="glitter">Glitter</option>
  </select>

  <label for="dur">Effect duration: <span id="durVal">2.6</span>s</label>
  <input type="range" id="dur" min="1200" max="5000" step="100" value="2600" />

  <div class="switch">
    <span>Enable effect on camera</span>
    <input type="checkbox" id="enabled" checked />
  </div>

  <div class="hint">
    Shortcut: <kbd>Alt</kbd>+<kbd>S</kbd> toggles Snap / Return.<br/>
    After changing "Enable", reload your meeting tab so the camera restarts.<br/>
    Works on Google Meet, Zoom Web, Teams, Whereby, Discord.
  </div>
  <script src="popup.js"></script>
</body>
</html>

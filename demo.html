<!doctype html><html><head><meta charset="utf-8"><title>Rex Snap engine demo</title>
<style>body{margin:0;background:#0b0f1a;color:#fff;font-family:system-ui}canvas{display:block;margin:10px auto;border:2px solid #4aa3ff;width:640px}
.row{text-align:center}button{padding:10px 18px;margin:6px;border-radius:10px;border:0;background:#0a84ff;color:#fff;font-weight:700}</style></head>
<body><div class="row"><b>Rex Snap — engine demo</b><br>
<button onclick="snap()">Snap</button><button onclick="back()">Return</button></div>
<canvas id="c" width="640" height="360"></canvas>
<script src="snap-engine.js"></script>
<script>
const W=640,H=360, c=document.getElementById('c'), ctx=c.getContext('2d');
const bg=document.createElement('canvas');bg.width=W;bg.height=H;const bctx=bg.getContext('2d');
const person=document.createElement('canvas');person.width=W;person.height=H;const pctx=person.getContext('2d');
const mask=document.createElement('canvas');mask.width=W;mask.height=H;
// room background
const g=bctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#e8b890');g.addColorStop(1,'#f3cfa8');
bctx.fillStyle=g;bctx.fillRect(0,0,W,H);
bctx.fillStyle='#e8d34a';bctx.fillRect(40,60,120,220);   // yellow door
bctx.fillStyle='#4a7a3a';bctx.beginPath();bctx.arc(560,250,50,0,7);bctx.fill(); // plant
// person: head + shirt (drawn on its own transparent canvas)
pctx.fillStyle='#2a2a30';pctx.beginPath();pctx.ellipse(320,120,55,62,0,0,7);pctx.fill();
pctx.fillStyle='#c98a5e';pctx.beginPath();pctx.ellipse(320,135,42,52,0,0,7);pctx.fill();
pctx.fillStyle='#111';pctx.beginPath();pctx.ellipse(320,320,140,130,0,0,7);pctx.fill();
const mctx=mask.getContext('2d');
mctx.drawImage(person,0,0);
mctx.globalCompositeOperation='source-in';mctx.fillStyle='#fff';mctx.fillRect(0,0,W,H);mctx.globalCompositeOperation='source-over';
bctx.drawImage(person,0,0);
const E=window.RexSnapEngine.create({width:W,height:H});
let phase='visible',t0=0,DUR=2600;
function snap(){phase='snapping';t0=performance.now()}
function back(){phase='returning';t0=performance.now()}
function frame(){
  const p=Math.min(1,(performance.now()-t0)/DUR);
  if(phase==='visible'){ctx.drawImage(bg,0,0);ctx.drawImage(person,0,0)}
  else if(phase==='snapping'){E.renderSnap(ctx,bg,person,mask,p,'dust');if(p>=1)phase='gone'}
  else if(phase==='gone'){E.renderGone(ctx,bg,mask)}
  else if(phase==='returning'){E.renderReturn(ctx,bg,person,mask,p,'dust');if(p>=1)phase='visible'}
  requestAnimationFrame(frame)}
frame();window.snap=snap;window.back=back;
</script></body></html>
